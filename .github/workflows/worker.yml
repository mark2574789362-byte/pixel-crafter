name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/worker/**'
      - '.github/workflows/worker.yml'
      - 'wrangler.toml'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare
        run: |
          echo "$REPLICATE_API_TOKEN" | wrangler secret put REPLICATE_API_TOKEN --name pixel-crafter-worker
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}